services:
  - type: web
    name: source-atlas-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_ACCESS_USERNAME
        value: admin
      - key: APP_ACCESS_PASSWORD
        sync: false
      - key: NEON_DATABASE_URL
        sync: false
      - key: NEON_MIGRATION_DATABASE_URL
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DOCUMENT_STORAGE_DIR
        value: /tmp/uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
